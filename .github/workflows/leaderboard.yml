# Run every algorithm at every cache size on both traces and publish the
# leaderboard (leaderboard/) to GitHub Pages.
#   release published:  on the release's commit
#   workflow_dispatch:  on the chosen branch
# Pages must be on, with "GitHub Actions" as its source (Settings > Pages).
name: leaderboard

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard

jobs:
  run:
    name: run (${{ matrix.trace }}, ${{ matrix.size }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        trace: [freeinference, chutes]
        size: [16k, 32k, 64k, 128k, 256k]
        shard: [0, 1, 2]  # a third of the algorithms each, so a job stays inside 6 hours
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libzstd-dev
      - run: pip install .
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: trace-${{ matrix.trace }}
      # as many runs at a time as the runner has cores; one past four hours is given
      # up (lfuda always is; random_compute and s3fifo can take two)
      - run: >-
          python leaderboard/run.py --trace ${{ matrix.trace }} --sizes ${{ matrix.size }}
          --shard ${{ matrix.shard }}/3 --jobs "$(nproc)" --timeout 14400
          --out results/${{ matrix.trace }}-${{ matrix.size }}-${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@v7
        if: always()  # the runs done so far, even past the time limit
        with:
          name: results-${{ matrix.trace }}-${{ matrix.size }}-${{ matrix.shard }}
          path: results/

  pages:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write  # deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # build.py reads the PrefixSim and libCacheSim commits
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - run: >-
          python3 leaderboard/build.py results/*.jsonl --out site
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
